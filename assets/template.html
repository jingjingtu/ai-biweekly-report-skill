<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{REPORT_TITLE}}</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#171c1a;color:#f2f7f5;font-family:MiSans,"PingFang SC","Noto Sans SC",sans-serif}body{padding:40px;display:grid;gap:40px;justify-content:center}.page{width:1920px;height:1080px;padding:64px 80px;position:relative;overflow:hidden;background:#030605}.page:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,245,138,.10) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,black 0,transparent 360px);pointer-events:none}.content{height:100%;position:relative;z-index:1;display:flex;flex-direction:column}.mono{font-family:MiSans,"PingFang SC",sans-serif}.single-line{line-height:calc(1em + 8px)}.multi-line{line-height:1.6}.eyebrow{font-size:24px;font-weight:700;line-height:32px;color:#00f58a}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:40px}.header h1{font-size:64px;line-height:1.12;margin:16px 0 0;font-weight:800}.header h1 em{color:#00f58a;font-style:normal}.header p{max-width:1064px;color:#97aaa4;font-size:28px;line-height:1.6;margin:16px 0 0}.meta{display:flex;gap:16px;color:#5e736c;font-size:24px}.tag{border:1px solid #064d31;border-radius:8px;padding:8px 16px;background:#06100c;white-space:nowrap;line-height:32px}.stage{margin-top:40px;flex:1;min-height:0}.section{height:100%;padding:32px 40px;border:1px solid #12352a;border-radius:16px;background:#0a1713}.section-k{font-size:24px;line-height:32px;color:#00f58a;font-weight:700}.section h2{font-size:40px;line-height:1.25;margin:8px 0 0}.section-desc{color:#97aaa4;font-size:24px;line-height:1.6;margin-top:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{padding:24px 32px 24px 24px;border:1px solid #174538;border-radius:8px;background:#050b09}.card.purple{border-color:#493767;background:#090611}.card.cyan{border-color:#155064;background:#041014}.card.orange{border-color:#744318;background:#130a03}.card .index{font-size:24px;line-height:32px;font-weight:700;color:#00f58a}.card.purple .index{color:#9b7bff}.card.cyan .index{color:#22d3ee}.card.orange .index{color:#ff9d32}.card h3{font-size:32px;line-height:40px;margin:16px 0}.card p{font-size:24px;line-height:1.6;color:#97aaa4;margin:0}.metric .n{font-size:48px;line-height:56px;color:#00f58a;font-weight:800}.metric .t{font-size:24px;line-height:32px;margin-top:16px;font-weight:700}.path{padding:24px;background:#07522f;border:1px solid #087244;border-radius:8px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:24px;line-height:32px}.path .arr{color:#71a792}.footer{margin-top:24px;padding-top:16px;border-top:1px solid #12352a;display:flex;justify-content:space-between;color:#5e736c;font-size:24px;line-height:32px}
</style>
</head>
<body>
  <!-- 每个 page 必须严格为 1920 × 1080；内容放不下时复制为下一页。 -->
  <main class="page" data-page="01"><div class="content">
    <header class="header" data-figma-group="01 页头"><div><div class="mono eyebrow">&gt; Qifu B System / biweekly.md</div><h1>{{PAGE_TITLE}}</h1><p>{{PAGE_SUBTITLE}}</p></div><div class="meta"><span class="tag">{{REPORT_PERIOD}}</span><span class="tag">{{CURRENT_STAGE}}</span></div></header>
    <section class="stage" data-figma-group="02 核心内容">{{PAGE_CONTENT}}</section>
    <footer class="footer" data-figma-group="99 页脚"><span>{{FOOTER_LEFT}}</span><span>{{PAGE_NUMBER}}</span></footer>
  </div></main>
</body>
</html>
