<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{REPORT_TITLE}}</title>
  <style>
    :root {
      --accent: {{BRAND_COLOR}};
      --canvas: #030605;
      --surface-1: #0a1713;
      --surface-2: #050b09;
      --text: #f2f7f5;
      --text-secondary: #a6b8b2;
      --text-muted: #789088;
      --border: #174538;
      --engineering: #9b7bff;
      --validation: #22d3ee;
      --risk: #ff9d32;
      --danger: #ff5f56;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: #171c1a;
      color: var(--text);
      font-family: MiSans, "PingFang SC", "Noto Sans SC", sans-serif;
    }

    body {
      display: grid;
      justify-content: center;
      gap: 40px;
      padding: 40px;
    }

    body.format-long-scroll {
      display: block;
      width: 1920px;
      min-width: 1920px;
      padding: 0;
      background: var(--canvas);
    }

    .page {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      padding: 64px 80px;
      background: var(--canvas);
      break-after: page;
    }

    .format-long-scroll .page {
      height: auto;
      min-height: 0;
      overflow: visible;
      padding: 96px 80px;
      break-after: auto;
    }

    .format-long-scroll .page + .page {
      border-top: 1px solid #0d3025;
    }

    .page::before {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
      background-image: radial-gradient(rgb(0 245 138 / 10%) 1px, transparent 1px);
      background-size: 32px 32px;
      -webkit-mask-image: linear-gradient(to bottom, black 0, transparent 360px);
      mask-image: linear-gradient(to bottom, black 0, transparent 360px);
    }

    .page-shell {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .format-long-scroll .page-shell {
      min-height: 0;
      height: auto;
    }

    .mono {
      font-family: "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
    }

    .report-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 40px;
    }

    .title-group {
      min-width: 0;
      max-width: 1320px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 24px;
      font-weight: 700;
      line-height: 32px;
    }

    h1 {
      margin: 16px 0 0;
      font-size: 60px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -1px;
    }

    .subtitle {
      max-width: 1200px;
      margin: 12px 0 0;
      color: var(--text-secondary);
      font-size: 26px;
      line-height: 1.6;
    }

    .meta {
      display: flex;
      flex: 0 0 auto;
      gap: 16px;
      color: var(--text-muted);
      font-size: 24px;
    }

    .tag,
    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 8px 16px;
      border: 1px solid #28604e;
      border-radius: 8px;
      background: #06100c;
      line-height: 32px;
      white-space: nowrap;
    }

    .stage {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 24px;
      min-height: 0;
      margin-top: 40px;
      overflow: hidden;
    }

    .format-long-scroll .stage {
      flex: none;
      overflow: visible;
    }

    .block {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface-1);
    }

    .statement {
      padding: 32px 40px;
    }

    .block-label,
    .card-label {
      color: var(--accent);
      font-size: 24px;
      font-weight: 700;
      line-height: 32px;
    }

    .statement h2,
    .note h2 {
      margin: 8px 0 0;
      font-size: 40px;
      line-height: 1.3;
    }

    .statement p,
    .note p {
      margin: 12px 0 0;
      color: var(--text-secondary);
      font-size: 24px;
      line-height: 1.6;
    }

    .cards,
    .metrics {
      display: grid;
      gap: 32px;
    }

    .cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .card,
    .metric {
      min-width: 0;
      padding: 24px 32px 24px 24px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
    }

    .tone-engineering {
      border-color: #5d4785;
      background: #090611;
    }

    .tone-engineering .card-label {
      color: var(--engineering);
    }

    .tone-validation {
      border-color: #1e647c;
      background: #041014;
    }

    .tone-validation .card-label {
      color: var(--validation);
    }

    .tone-risk {
      border-color: #85501e;
      background: #130a03;
    }

    .tone-risk .card-label {
      color: var(--risk);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .status {
      min-height: 40px;
      padding: 4px 12px;
      color: var(--text-secondary);
      font-size: 24px;
      line-height: 32px;
    }

    .status[data-status="BLOCKED"] {
      border-color: #7c302d;
      color: #ff8a84;
    }

    .card h3 {
      margin: 16px 0 0;
      font-size: 32px;
      line-height: 1.3;
    }

    .card p,
    .card-meta {
      margin: 12px 0 0;
      color: var(--text-secondary);
      font-size: 24px;
      line-height: 1.6;
    }

    .card-meta {
      color: var(--text-muted);
    }

    .metric-value {
      color: var(--accent);
      font-size: 48px;
      font-weight: 800;
      line-height: 56px;
    }

    .metric-label {
      margin-top: 12px;
      font-size: 26px;
      font-weight: 700;
      line-height: 36px;
    }

    .metric-meta {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 24px;
      line-height: 32px;
    }

    .path {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 24px;
      border: 1px solid #087244;
      border-radius: 8px;
      background: #07522f;
      font-size: 24px;
      font-weight: 700;
      line-height: 32px;
    }

    .path-arrow {
      color: #a6d8c8;
    }

    .note {
      padding: 24px 32px;
    }

    .report-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #204438;
      color: var(--text-muted);
      font-size: 24px;
      line-height: 32px;
    }

    .page-number {
      width: 160px;
      text-align: right;
    }

    @media print {
      @page {
        size: 1920px 1080px;
        margin: 0;
      }

      html,
      body {
        background: var(--canvas);
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      body {
        display: block;
        padding: 0;
      }

      .page {
        margin: 0;
      }

      .format-long-scroll .page {
        min-height: 1080px;
        break-after: page;
      }
    }
  </style>
</head>
<body class="{{BODY_CLASS}}" data-report-format="{{REPORT_FORMAT}}" data-narrative-mode="{{NARRATIVE_MODE}}" data-sample-archetype="{{SAMPLE_ARCHETYPE}}" data-reference-samples="{{REFERENCE_SAMPLES}}">
{{PAGES}}
</body>
</html>
